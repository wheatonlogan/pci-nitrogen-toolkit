name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ngu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests drop and recreate this app's tables in this throwaway database.
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/ngu_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # playwright-core's own CLI installs the Chromium build that matches the locked version.
      - run: npx playwright-core install --with-deps chromium
      - name: npm test (fails if any test is skipped, so the browser tests can't silently drop out)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          grep -Eq '^(# skipped|ℹ skipped) 0$' test-output.txt
